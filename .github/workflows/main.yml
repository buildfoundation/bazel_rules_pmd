name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Cancel previous actions from the same PR or branch except 'master' branch.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'master' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

jobs:
  pre_commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        bazel_version: ["8.x", "9.x", "rolling"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }}, bazel ${{ matrix.bazel_version }})
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
    steps:
      - name: "Checkout the sources"
        uses: actions/checkout@v7.0.1
      - name: "Install JDK 21"
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: "Setup Bazel"
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: "Unit tests"
        run: bazel test //...
      - name: "Integration tests"
        run: bash tests/integration/suite.sh
      - name: Verify MODULE.bazel.lock is unchanged
        if: ${{ always() && matrix.bazel_version == '9.x' }}
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- MODULE.bazel.lock)" ]]; then
            git diff -- MODULE.bazel.lock
            git diff --cached -- MODULE.bazel.lock
            echo "::error file=MODULE.bazel.lock::MODULE.bazel.lock changed during CI. Run Bazel locally and commit the updated lockfile."
            exit 1
          fi
